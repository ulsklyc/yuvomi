name: Umbrel Catalog Publish

# Opens/updates a PR to getumbrel/umbrel-apps bumping Yuvomi to the released
# version with a freshly resolved, digest-pinned image. Umbrel has NO auto-bump
# bot (unlike TrueNAS), so this is what keeps the store entry current.
#
# Requirements:
#   - Secret UMBREL_FORK_TOKEN: a classic PAT with `repo` scope (push to the
#     <owner>/umbrel-apps fork + open a cross-repo PR to getumbrel/umbrel-apps).
#   - The fork <owner>/umbrel-apps must exist (created during the initial submission).
#   - Only acts once Yuvomi is already in upstream master (after the initial
#     submission PR is merged); before that it skips to avoid re-submitting.
#
# It edits the maintainers' upstream files IN PLACE (version, releaseNotes,
# image digest) — it never overwrites them with our source, so any review tweaks
# (port, gallery, category, …) are preserved across updates.
#
# ES FOLGT DEN REGELN DES KATALOG-REPOS, und die stehen dort, nicht hier:
# getumbrel/umbrel-apps führt eine `AGENTS.md`, die auf
# `.claude/skills/umbrel-update-app/` verweist. Deren Maintainer hat vor dem
# Merge von v2.6.0 die `releaseNotes` von Hand umgeschrieben und darum gebeten,
# diese Anleitung künftig zu befolgen (Kommentar an PR #5980). Drei Dinge daraus
# sind hier eingebaut:
#
#   1. `releaseNotes` sind KNAPP und für Endnutzer geschrieben, plus Link auf
#      die vollen Notizen. Sie kommen deshalb nicht mehr aus einer Umformung des
#      Release-Bodys, sondern aus `.github/umbrel-release-notes.md` — dort steht
#      auch, warum die Automatik daran gescheitert ist.
#   2. Der PR-Body nennt alte und neue Version, die Quelle, was am Paket
#      geändert wurde, wie geprüft wurde und für welche Architekturen — genau
#      die Felder, die ihre „PR Readiness" verlangt. Dazu ausdrücklich, was
#      NICHT geprüft wurde: der Update-Pfad durch umbrelOS läuft hier nicht.
#   3. Ihr Linter (`node .tools/lint-apps.mjs <app> --check-images`) läuft vor
#      dem Push. Sein Urteil ist verbindlich; nur seine Einrichtung (ein
#      `npm install` in ihrem Repo) darf den Release nicht rot machen.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.65.1). Defaults to the latest release."
        required: false

permissions:
  contents: read

concurrency:
  group: umbrel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 30 statt der 15, mit denen dieser Deckel zuerst dastand: der
    # Digest-Schritt wartet ABSICHTLICH bis zu 20 Minuten auf das
    # Release-Image (40 Versuche x 30 s), und ein Deckel darunter haette den
    # Job mitten in seinem eigenen Wartefenster abgeschnitten - lautlos, denn
    # ein abgebrochener Job meldet nicht "das Image kam nicht", er meldet
    # gar nichts. Ein Laufzeitdeckel muss zum laengsten ABSICHTLICHEN Warten
    # im Job passen, nicht zu seiner ueblichen Dauer.
    timeout-minutes: 30
    steps:
      - name: Check out (for the authored Umbrel release notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          elif [ -n "$RELEASE_TAG" ]; then
            V="$RELEASE_TAG"
          else
            V="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          fi
          V="${V#v}"
          # Validate: only a semver-like token may flow into later shell/sed/PR steps.
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.]+)?$'; then
            echo "::error::Refusing to proceed: '$V' is not a valid version string."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      # DER STORE GEHT NIE RUECKWAERTS, und die Marken-Pruefung unten faengt das
      # NICHT - das ist am 2026-08-17 gemessen worden, nicht vermutet.
      #
      # Die Lage: v2.19.0 hatte nie eine Release-Seite bekommen (der Tag war da,
      # der Release fehlte), und sie wurde nachgetragen, waehrend der Store
      # laengst auf 2.21.0 zeigte. Der Lauf war GRUEN und hat den offenen
      # Store-PR von 2.21.0 auf 2.19.0 zurueckgedreht - ein Downgrade, das ein
      # Maintainer haette mergen koennen.
      #
      # WARUM DER MARKEN-GUARD DAS DURCHLAESST: `actions/checkout` holt beim
      # release-Event den TAG, nicht `main`. Dort steht
      # `<!-- version: 2.19.0 -->`, weil sie im Release-Commit von 2.19.0
      # geschrieben wurde - die Marke passt per Konstruktion, und zwar fuer JEDES
      # nachgetragene Release. Sie sichert zu, dass die Notiz zur Version passt;
      # sie sagt nichts darueber, ob die Version die neueste ist. Zwei Fragen,
      # ein Guard, und der zweite war nie gestellt.
      #
      # Verglichen wird gegen den HOECHSTEN veroeffentlichten Release, nicht
      # gegen das `latest`-Flag: das Flag laesst sich beim Anlegen setzen
      # (`--latest=false`), waere hier also genau von der Sorgfalt abhaengig, die
      # dieser Guard ersetzen soll. Entwuerfe und Vorabversionen zaehlen nicht -
      # der Store folgt nur stabilen Releases.
      #
      # NUR FUER DAS release-EREIGNIS. Ein `workflow_dispatch` mit ausdruecklich
      # genannter Version ist eine Handlung, kein Automatismus: er ist der Weg,
      # den Store nach genau diesem Unfall wieder geradezuruecken, und derselbe
      # Weg traegt einen bewussten Rollback auf eine aeltere Version.
      - name: Refuse to walk the store backwards
        id: gate
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NEWEST="$(gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed 's/^v//' | sort -V | tail -1)"
          if [ -z "$NEWEST" ]; then
            echo "::error::Kein veroeffentlichter Release gefunden - der Vergleich haette nichts zu vergleichen, und ein Guard ueber eine leere Liste ist keiner."
            exit 1
          fi
          echo "Neuester stabiler Release: $NEWEST, veroeffentlicht wird: $VERSION"
          # `sort -V | tail -1` liefert bei Gleichstand den Wert selbst - ein
          # erneutes Veroeffentlichen derselben Version laeuft also durch.
          HIGHER="$(printf '%s\n%s\n' "$VERSION" "$NEWEST" | sort -V | tail -1)"
          if [ "$HIGHER" != "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION ist aelter als der neueste Release v$NEWEST - der Store-Eintrag bleibt, wo er ist. Ein nachgetragenes altes Release ist Archivpflege und darf Haushalten kein Downgrade vorschlagen. Fuer einen GEWOLLTEN Rueckschritt diesen Workflow von Hand mit der Zielversion starten."
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Die Notizen VOR dem Warten auf das Image prüfen: eine fehlende oder
      # veraltete Marke soll in Sekunden auffallen und nicht nach zwanzig
      # Minuten Registry-Warteschlange.
      - name: Verify the authored Umbrel release notes
        id: notes
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          F=".github/umbrel-release-notes.md"
          if [ ! -f "$F" ]; then
            echo "::error::$F fehlt. Der Umbrel-Store braucht knappe, für Endnutzer geschriebene releaseNotes (getumbrel/umbrel-apps AGENTS.md → .claude/skills/umbrel-update-app). Die Datei erklärt in ihrem Kopf, wie sie zu schreiben ist."
            exit 1
          fi
          MARKED="$(grep -m1 -oE '^<!-- version: [0-9A-Za-z.+-]+ -->$' "$F" | grep -oE '[0-9][0-9A-Za-z.+-]*' || true)"
          if [ "$MARKED" != "$VERSION" ]; then
            echo "::error::$F ist auf '${MARKED:-<keine Marke>}' markiert, veröffentlicht wird '$VERSION'. Eine veraltete Store-Notiz ist schlimmer als keine: sie beschreibt Haushalten ein Update, das sie nicht bekommen. Notizen für v$VERSION schreiben und die Marke mitziehen."
            exit 1
          fi
          # Den Text OHNE den Erklaerkopf ablegen, und zwar ausserhalb des
          # Arbeitsverzeichnisses: der PR-Schritt arbeitet in `fork/` und käme
          # sonst nicht mehr an die Datei.
          OUT="$RUNNER_TEMP/umbrel-release-notes.txt"
          python3 - "$F" "$OUT" <<'PY'
          import re, sys
          src, dst = sys.argv[1], sys.argv[2]
          text = open(src, encoding="utf-8").read()
          # Jeder HTML-Kommentar ist Anleitung fuer uns, nicht Text fuer den Store.
          body = re.sub(r"<!--.*?-->", "", text, flags=re.S).strip()
          if len(body) < 40:
            sys.exit("::error::Die Release-Notizen sind nach dem Entfernen der Kommentare leer.")
          open(dst, "w", encoding="utf-8").write(body + "\n")
          print(f"{len(body)} Zeichen Store-Text.")
          PY
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "✓ Release-Notizen sind auf $VERSION markiert."

      - name: Resolve multi-arch image digest (wait for the image to publish)
        id: digest
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/yuvomi:${{ steps.ver.outputs.version }}"
          for i in $(seq 1 40); do
            # `|| true` keeps a not-yet-published image (pipefail makes inspect's
            # failure propagate) from tripping `set -e` and aborting the retry loop.
            D="$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
            if [ -n "$D" ]; then
              echo "digest=$D" >> "$GITHUB_OUTPUT"
              echo "✓ $IMG -> $D"
              exit 0
            fi
            echo "waiting for $IMG to appear ($i/40)…"
            sleep 30
          done
          echo "::error::image $IMG not found after ~20 min — did Docker Publish run?"
          exit 1

      # Ihr Update-Gate verlangt ausdrücklich „multi-arch manifest-list/index
      # digest, and linux/amd64 plus linux/arm64 support". Der Schritt oben nimmt
      # nur den Digest der Manifest-Liste - dass beide Plattformen darin stehen,
      # war bisher eine Annahme. Der PR-Body behauptet es, also wird es gemessen.
      - name: Verify the image covers amd64 and arm64
        id: arch
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/yuvomi:${{ steps.ver.outputs.version }}"
          PLATFORMS="$(docker buildx imagetools inspect "$IMG" --raw \
            | jq -r '[.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | unique | join(", ")')"
          echo "Plattformen: ${PLATFORMS:-<keine>}"
          for want in linux/amd64 linux/arm64; do
            case "$PLATFORMS" in
              *"$want"*) ;;
              *) echo "::error::$IMG deckt $want nicht ab (gefunden: ${PLATFORMS:-keine}). Umbrel läuft auf beiden Architekturen."; exit 1 ;;
            esac
          done
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

      - name: Open / update PR on getumbrel/umbrel-apps
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.UMBREL_FORK_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          PLATFORMS: ${{ steps.arch.outputs.platforms }}
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          FORK="$OWNER/umbrel-apps"
          UPSTREAM="getumbrel/umbrel-apps"
          BRANCH="yuvomi-update"

          git config --global user.name "$OWNER"
          git config --global user.email "$ACTOR@users.noreply.github.com"

          # Check the credential once, before anything uses it. `gh repo fork`
          # below ends in `|| true`, so a bad token used to be swallowed there and
          # surfaced two lines later as git's "URL rejected: Malformed input to a
          # URL function" - which points at the clone URL, not at the secret
          # (2026-08-05). Reporting the login also catches a token that is valid
          # but belongs to the wrong account.
          TOKEN_USER="$(gh api user --jq .login 2>/dev/null || true)"
          if [ -z "$TOKEN_USER" ]; then
            echo "::error::UMBREL_FORK_TOKEN was rejected by the API. A stray newline or space in the secret value is the usual cause (piping it through 'echo' adds one). Re-set it with: gh auth token | tr -d '[:space:]' | gh secret set UMBREL_FORK_TOKEN --repo $OWNER/yuvomi"
            exit 1
          fi
          echo "UMBREL_FORK_TOKEN authenticates as: $TOKEN_USER"

          gh repo fork "$UPSTREAM" --clone=false || true

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$FORK.git" fork
          cd fork
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --depth 1 upstream master
          git checkout -B "$BRANCH" upstream/master

          # Guard: only update once Yuvomi is already in upstream master. Before the
          # initial submission is merged there is nothing to edit — skip.
          if [ ! -f yuvomi/umbrel-app.yml ]; then
            echo "::notice::Yuvomi is not yet in upstream master (initial submission still pending). Skipping auto-update."
            exit 0
          fi

          # Die alte Version festhalten, BEVOR sie überschrieben wird: ihre
          # „PR Readiness" verlangt sie im PR-Body, und danach ist sie weg.
          OLD_VERSION="$(grep -m1 -E '^version:' yuvomi/umbrel-app.yml | sed -E 's|^version: *"?([^"]*)"?.*|\1|')"
          echo "Katalog steht auf: ${OLD_VERSION:-<unbekannt>}"

          # Edit the maintainers' files IN PLACE — never overwrite them with our
          # source, so their port / gallery / category / review tweaks are preserved.
          sed -i -E "s|^version: .*|version: \"$VERSION\"|" yuvomi/umbrel-app.yml
          sed -i -E "s|image: ghcr.io/$OWNER/yuvomi:[^@[:space:]]+@sha256:[0-9a-f]+|image: ghcr.io/$OWNER/yuvomi:$VERSION@$DIGEST|" yuvomi/docker-compose.yml

          # releaseNotes aus der von Hand geschriebenen Datei, als GEFALTETES
          # BLOCKSKALAR (`>-`) - so, wie der Rest ihrer Datei geschrieben ist.
          #
          # Ein JSON-kodierter Einzeiler wäre gültiges YAML und semantisch
          # identisch; er stand nach dem v2.6.1-Lauf als 620-Zeichen-Zeile in
          # ihrem Manifest, während `description` daneben umbrochen ist. Diese
          # Datei wird von Menschen gelesen und im Review editiert, und ein
          # Einzeiler macht jeden künftigen Diff unlesbar.
          #
          # In folded style faltet EIN Umbruch zu einem Leerzeichen und eine
          # LEERZEILE wird ein Umbruch - ein Absatzumbruch braucht deshalb ZWEI
          # Leerzeilen. Genau so steht es in der handgeschriebenen Fassung des
          # Maintainers, und die Gleichheit wird unten bewiesen statt behauptet.
          #
          # HIER STAND EINE UMFORMUNG DES RELEASE-BODYS: Überschriften weg,
          # Aufzählungszeichen weg, Rest als Prosa. Sie war syntaktisch
          # einwandfrei und inhaltlich falsch - unser CHANGELOG ist für
          # Entwickler geschrieben und stand damit im Update-Dialog eines
          # Haushalts. Umbrels Maintainer hat den Text vor dem Merge von v2.6.0
          # von Hand ersetzt; die Regeln dafür stehen in ihrem
          # `.claude/skills/umbrel-update-app/` und die Umsetzung im Kopf von
          # `.github/umbrel-release-notes.md`.
          python3 - "$NOTES_FILE" <<'PY'
          import re, sys, textwrap
          notes = open(sys.argv[1], encoding="utf-8").read().strip()

          # KEIN UMBRUCH INNERHALB EINES WORTES, und das ist keine Kosmetik,
          # sondern der Unterschied zwischen dem geschriebenen und dem
          # gelesenen Text. In folded style wird JEDER Zeilenumbruch zu einem
          # Leerzeichen - auch einer, den `textwrap` mitten in ein Wort gesetzt
          # hat. Mit den Voreinstellungen bricht es an Bindestrichen
          # (`break_on_hyphens`) und in ueberlangen Woertern
          # (`break_long_words`), und aus „increase-contrast" wurde beim
          # Zurueckparsen „increase- contrast": ein Zeichen mehr, ein Wort
          # kaputt. Gefunden hat es der Round-Trip-Guard unten, im v2.21.0-Lauf,
          # nachdem der erste Bindestrich-Begriff zufaellig auf einer
          # Zeilengrenze landete - die Faltung ist bis dahin nie aufgefallen,
          # weil kein Text sie ausgeloest hatte. Ein zu langes Wort (eine URL)
          # ragt jetzt lieber ueber die Spaltenbreite hinaus, als sich zerlegen
          # zu lassen; YAML stoert das nicht, den Leser auch nicht.
          def folded(s, indent="  ", width=78):
            out = []
            for i, para in enumerate(s.split("\n\n")):
              if i:
                out += ["", ""]   # zwei Leerzeilen = EIN Absatzumbruch
              wrapped = textwrap.wrap(
                para.strip(), width=width,
                break_on_hyphens=False, break_long_words=False,
              )
              out += [indent + l for l in wrapped]
            return "releaseNotes: >-\n" + "\n".join(out) + "\n"

          # The upstream value is a BLOCK scalar spanning many indented lines:
          #
          #   releaseNotes: >-
          #     Loans can now track whether …
          #     assign installments to an account …
          #
          # Matching only "^releaseNotes:.*$" replaced its first line and left the
          # indented continuation behind, so the file became invalid YAML and the
          # PR carried a broken manifest (seen on the v1.79.0 release). Consume the
          # whole block: up to the next line starting a top-level key, or EOF.
          p = "yuvomi/umbrel-app.yml"
          t = open(p, encoding="utf-8").read()
          t, n = re.subn(
            r"^releaseNotes:.*?(?=^[A-Za-z]|\Z)",
            lambda _: folded(notes),
            t,
            count=1,
            flags=re.M | re.S,
          )
          if n != 1:
            sys.exit("::error::releaseNotes block not found in yuvomi/umbrel-app.yml")
          open(p, "w", encoding="utf-8").write(t)

          # BEWIESEN, NICHT BEHAUPTET. Ein Blockskalar ist lesbarer als ein
          # JSON-Einzeiler und dafuer empfindlich gegen Einrueckung und
          # Faltungsregeln - eine falsch umbrochene Zeile wuerde den Text still
          # umformen statt die Datei zu brechen. Also zurueckparsen und auf
          # ZEICHENGLEICHHEIT pruefen.
          import yaml
          back = yaml.safe_load(open(p, encoding="utf-8"))["releaseNotes"]
          if back != notes:
            sys.exit(
              "::error::Das ausgegebene Blockskalar liest sich nicht als der geschriebene Text zurueck.\n"
              f"  erwartet ({len(notes)} Zeichen): {notes[:120]!r}\n"
              f"  gelesen  ({len(back)} Zeichen): {back[:120]!r}"
            )
          print(f"releaseNotes: {len(notes)} Zeichen, {len(notes.split(chr(10) * 2))} Absaetze, Round-Trip OK.")
          PY

          echo "--- updated ---"
          grep -E '^(version|releaseNotes):' yuvomi/umbrel-app.yml
          grep 'image:' yuvomi/docker-compose.yml

          # A malformed manifest must never reach the maintainers' PR: fail here
          # instead. python3 on ubuntu-latest ships PyYAML.
          python3 -c "import yaml,sys; yaml.safe_load(open('yuvomi/umbrel-app.yml')); yaml.safe_load(open('yuvomi/docker-compose.yml')); print('YAML OK')"

          if git diff --quiet -- yuvomi/; then
            echo "Catalog already at v$VERSION — nothing to do."
            exit 0
          fi

          # IHR LINTER, NICHT UNSERE VORSTELLUNG DAVON. `umbrel-update-app`
          # verlangt ihn vor dem Testen; er prüft Pflichtfelder, Kategorien,
          # Hooks und mit `--check-images` auch, dass die Images ziehbar und
          # digest-gepinnt sind. Sein URTEIL ist verbindlich - seine EINRICHTUNG
          # darf den Release nicht rot machen: `npm install` in einem fremden
          # Repo ist eine Netzabhängigkeit, die uns nicht gehört.
          if [ -f package.json ] && [ -f .tools/lint-apps.mjs ]; then
            if npm install --no-audit --no-fund --silent; then
              echo "--- npm run lint:apps -- yuvomi --check-images ---"
              node .tools/lint-apps.mjs yuvomi --check-images
              LINT_NOTE="passed (\`node .tools/lint-apps.mjs yuvomi --check-images\`)"
            else
              echo "::warning::npm install im Katalog-Repo ist fehlgeschlagen - der Linter lief nicht. Der PR sagt das."
              LINT_NOTE="not run (dependency install failed on the runner)"
            fi
          else
            echo "::warning::Kein Linter im Katalog-Repo gefunden - Pfad geändert?"
            LINT_NOTE="not run (\`.tools/lint-apps.mjs\` not found)"
          fi

          # Genau die Dateien, die sich geändert haben - für den PR-Body, damit
          # „was am Paket geändert wurde" eine Messung ist und keine Behauptung.
          CHANGED="$(git diff --name-only -- yuvomi/ | sed 's|^|- `|; s|$|`|')"

          git add yuvomi/
          git commit -m "yuvomi: update to v$VERSION"
          git push --force origin "$BRANCH"

          # Der PR-Body nach ihrer „PR Readiness": alte und neue Version, Quelle,
          # Testumfang, Architekturen, Breaking Changes - und ausdrücklich, was
          # NICHT geprüft wurde. Ein Automat, der „getestet" behauptet, wo er nur
          # gebaut hat, ist schlimmer als einer, der schweigt.
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            printf 'Automated update of Yuvomi, prepared by the release workflow in `%s/yuvomi` and following this repo'"'"'s `AGENTS.md`.\n\n' "$OWNER"
            printf '| | |\n|---|---|\n'
            printf '| Old version | `%s` |\n' "${OLD_VERSION:-unknown}"
            printf '| New version | `%s` |\n' "$VERSION"
            printf '| Upstream release | https://github.com/%s/yuvomi/releases/tag/v%s |\n' "$OWNER" "$VERSION"
            printf '| Image | `ghcr.io/%s/yuvomi:%s@%s` |\n' "$OWNER" "$VERSION" "$DIGEST"
            printf '| Architectures | %s |\n' "${PLATFORMS:-unverified}"
            printf '| Linter | %s |\n\n' "$LINT_NOTE"
            printf '**Package changes**\n\n%s\n\n' "$CHANGED"
            printf 'Manifest `version`, `releaseNotes` and the pinned image digest. No changes to compose wiring, env vars, volumes, ports, `app_proxy`, hooks, exports or permissions, so there is nothing for existing installs to migrate.\n\n'
            printf '**Breaking changes**\n\nNone. This is a patch/minor upstream release; see the upstream notes above for the user-visible list.\n\n'
            printf '**Testing performed**\n\n'
            printf -- '- Upstream CI (`npm test`) green on the release commit.\n'
            printf -- '- Image pulled from the public registry and pinned by the multi-arch index digest; `linux/amd64` and `linux/arm64` verified to be present in the manifest list.\n'
            printf -- '- Manifest and compose parsed as YAML after editing.\n'
            printf -- '- %s\n\n' "Repo linter: $LINT_NOTE"
            printf '**Not tested**: the update path was not exercised through umbrelOS itself - this workflow has no Umbrel instance. The package change is limited to the manifest version, the release notes and the image digest.\n'
          } > "$BODY_FILE"

          # An open PR is the NORMAL state here: the branch is long-lived and every
          # release force-pushes onto it. Only the first release of a catalog cycle
          # actually opens one.
          #
          # `gh pr list --head` matches the branch name alone. The "owner:branch"
          # form that a cross-repo PR needs matches nothing there, so the open PR
          # looked absent, `gh pr create` refused with "already exists" and turned a
          # working run red - the manifest was on the branch and the PR carried it
          # (v1.80.0, PR #5956). The REST endpoint does understand "owner:branch".
          open_pr() {
            gh api "repos/$UPSTREAM/pulls?head=$OWNER:$BRANCH&state=open" \
              --jq '.[0].number // empty' 2>/dev/null || true
          }

          EXISTING="$(open_pr)"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open - the force-push above updated it to v$VERSION."
            # Titel UND Body nachziehen. Bisher wurde nur der Titel aktualisiert,
            # sodass ein rollender PR die Angaben seiner ERSTEN Version trug -
            # und genau die Felder, die ihre „PR Readiness" verlangt (alte
            # Version, Digest, Testumfang), waren dann falsch statt fehlend.
            gh pr edit "$EXISTING" --repo "$UPSTREAM" \
              --title "yuvomi: update to v$VERSION" \
              --body-file "$BODY_FILE" || true
            exit 0
          fi

          gh pr create --repo "$UPSTREAM" --base master --head "$OWNER:$BRANCH" \
            --title "yuvomi: update to v$VERSION" \
            --body-file "$BODY_FILE" \
          || {
            # A PR that appeared between the lookup and here is not a failure either:
            # the update sits on the branch, so the PR carries it regardless.
            AFTER="$(open_pr)"
            if [ -z "$AFTER" ]; then
              echo "::error::Could not open the catalog PR, and none is open."
              exit 1
            fi
            echo "::notice::PR #$AFTER was opened concurrently; it carries v$VERSION."
          }
