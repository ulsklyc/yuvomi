name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
    # A documentation-only push used to build the full multi-arch image (QEMU,
    # amd64 + arm64, two registries) for files that never reach the image.
    #
    # THE RELEASE PATH IS NOT AFFECTED, and that holds for two independent
    # reasons - one of them would do, but this filter sits next to a `tags:`
    # entry and the next reader deserves better than "probably fine":
    #   1. GitHub does not evaluate path filters for TAG pushes. `v*` therefore
    #      always runs, and the versioned images plus `latest` come from exactly
    #      that run.
    #   2. Even the branch run survives: a `chore: release vX.Y.Z` commit always
    #      touches package.json, package-lock.json and public/sw.js, so it is
    #      never docs-only and never matches this filter.
    #
    # Ignoring docs/ costs the image nothing either way - .dockerignore drops it
    # from the build context, and no Markdown is read at runtime (the in-app
    # changelog proxies the GitHub releases API, it does not read CHANGELOG.md).
    #
    # .github/ is deliberately NOT ignored: editing this workflow should still
    # produce a build that proves it works.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # For keyless signing: cosign asks GitHub for an OIDC token that names this
  # workflow, and Sigstore issues a short-lived certificate for that identity.
  # No key is stored anywhere; the identity IS the workflow file at a tag.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Gemessene Laufzeit 0.7-3.1 min, kein absichtliches Warten im Job -
    # 30 ist ~10x Puffer fuer einen kalten buildx-Cache.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # IMAGE_NAME = github.repository → ghcr.io/ulsklyc/yuvomi (primary, post-rename).
          # The second image is a PERMANENT parallel push to the legacy
          # ghcr.io/ulsklyc/oikos package. It must NOT be removed: legacy users run
          # docker-compose/Unraid/TrueNAS configs that still reference the old image
          # name, and the app self-migrates the database on boot — so an unchanged
          # legacy config keeps receiving updates indefinitely without any manual edit.
          # Dropping this mirror would break `docker pull ghcr.io/ulsklyc/oikos` and
          # force every legacy user to hand-edit their config. Keep it.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oikos
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          # Both travel inside the image index as attestation manifests, so a
          # `docker pull` gets them for free and `docker buildx imagetools inspect`
          # shows them. Provenance says which workflow built the image from which
          # commit; the SBOM lists what is inside it. Neither is a signature.
          provenance: true
          sbom: true

      # DIE COSIGN-VERSION IST GEPINNT, NICHT GEERBT. Ohne `cosign-release` nimmt
      # die Action ihren eigenen Default, und der wandert mit ihrer Hauptversion:
      # der Installer v3.10.1 bringt cosign v2.6.1, v4.1.2 brächte v3.0.6. Das ist
      # kein Versionsdetail, sondern ein Formatwechsel - cosign 3 legt
      # Container-Signaturen als OCI-1.1-Referring-Artifact ab statt nach der alten
      # Tag-Konvention. Wer das prüft, sind Store-Betreiber (Umbrel, TrueNAS,
      # Unraid) mit ihrer eigenen cosign-Fassung und dem Befehl aus
      # docs/installation.md. Ein Dependabot-Bump der Action würde dieses Format
      # also still umstellen, während CI grün bleibt: gebaut wird korrekt, brechen
      # würde es beim Prüfer, Wochen später, auf einem fremden Rechner.
      # Der Sprung auf cosign 3 ist zu treffen, nicht zu erben - und dann zusammen
      # mit einem Wort für die Betreiber in docs/installation.md.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.1'

      # Signed BY DIGEST, never by tag: a tag can be moved after the fact, the
      # digest names exactly the index that was just pushed. Both image names
      # share that digest, so both get a signature. The signature is the one
      # thing a store operator (Umbrel, TrueNAS, Unraid) can check without
      # reading the code; docs/installation.md carries the verify command, and
      # test:docker-publish keeps that command's identity in step with this file.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MIRROR: ${{ env.REGISTRY }}/${{ github.repository_owner }}/oikos
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${MIRROR}@${DIGEST}"
