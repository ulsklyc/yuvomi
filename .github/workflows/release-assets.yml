name: Release Assets

# Puts a signed tarball on every GitHub release: `yuvomi-<version>-dist.tar.gz`,
# its `SHA256SUMS`, and a build provenance attestation over both (Sigstore,
# keyless, verified with `gh attestation verify ... -R ulsklyc/yuvomi`).
# YunoHost and the Proxmox community script install from this asset instead of
# GitHub's generated source tarball (phase 1a, section A of the roadmap).
#
# THE RELEASE STAYS A DRAFT UNTIL THE ASSET IS ON IT. release-prep creates the
# release with `--draft` and then starts this workflow AT THE TAG:
#   gh workflow run release-assets.yml --ref vX.Y.Z -f tag=vX.Y.Z
# The run must sit on the tag, not on main: the attestation takes its source
# (repository, ref, commit) from the run's OIDC token, so a run on main would
# sign "built from main@<sha>" for a tarball of the tag, and
# `gh attestation verify --source-ref refs/tags/vX.Y.Z` would fail. The first
# step refuses any other ref.
# It builds, attests, uploads and only then publishes the release. Drafts are
# invisible to `releases/latest`, to the YunoHost autoupdater
# (`latest_github_release`) and to Proxmox (`check_for_gh_release`), so there
# is no window in which a release exists without its asset - Proxmox
# `prebuild` would silently fall back to the previous release in that window.
# If a step fails, the release simply stays a draft; run it again with the tag.
#
# TWO JOBS: BUILD WITHOUT WRITE RIGHTS, PUBLISH WITHOUT FOREIGN CODE. Since
# section D the build runs `npm ci` with the devDependencies (Vite, its
# plugins, every install script they pull in) and `npm run build`. None of that
# code may hold a token that can overwrite release assets, start workflows or
# sign an attestation. So the job `build` runs with `contents: read` only, no
# GH_TOKEN and no OIDC token, and hands the tarball and SHA256SUMS over as a
# workflow artifact. The job `publish` holds the write rights and the OIDC
# token, runs no npm and no project code (no checkout at all): it checks the
# hashes, attests, uploads, publishes and hands over to Umbrel. GH_TOKEN sits
# on the steps that call `gh`, never on the job. The `sha256sum -c` there is a
# TRANSPORT check against a file from the same, deliberately rights-less build
# job (did the artifact arrive intact), not a guard against a manipulated
# build: whoever controls the build writes both files. What protects the build
# is that it holds no token; what lets anyone check it is the determinism check
# and the attestation.
#
# WHY A DISPATCH AND NOT `release: created`. GitHub does not trigger workflows
# for the `created`, `edited` or `deleted` activity of a DRAFT release
# (docs: "Events that trigger workflows" > release). A `created` trigger would
# only fire for a release that is already public, which is exactly the window
# this workflow exists to close. `published` is too late for the same reason.
# So the start is explicit, and a forgotten start leaves an invisible draft,
# never a public release without its tarball.
#
# CONTENT (phase 1a, section D): the `git archive` tree of the tag PLUS the
# built web app `dist/` (with `dist/THIRD-PARTY-NOTICES.txt`), under the one
# top-level folder `yuvomi-<version>/` (decision E2). The source stays in the
# tarball: the server imports shared code from public/utils/ and reads
# public/locales/, and YunoHost (`in_subdir`) and Proxmox (`prebuild`) strip
# exactly one folder, run `npm ci --omit=dev` and start `node server/index.js`,
# which refuses to start without dist/. Before packing, the build runs twice
# more in two fresh directories (scripts/check-build-determinism.mjs): the
# attestation is worth something only if the tarball can be rebuilt from the
# source. The pack itself is reproducible too: sorted entries, owner 0,
# mtime of the tagged commit, `gzip -n`.
#
# PUBLISHING WITH GITHUB_TOKEN TRIGGERS NOTHING. Events caused by the workflow
# token never start other workflows (except workflow_dispatch and
# repository_dispatch), so `umbrel-publish.yml`, which listens to
# `release: published`, would not run for a release this job publishes. The
# last step therefore dispatches it explicitly, on every successful run for
# the NEWEST release: a rerun after a failure past the publish step sees the
# release already public and must still hand over, and the Umbrel workflow
# updates its PR in place, so a second run for the same version changes
# nothing. A run for an older tag hands over nothing: umbrel-publish refuses to
# walk the store backwards only for its `release` event, while a dispatch is
# its deliberate rollback path. It is dispatched at the
# TAG, not at main: umbrel-publish reads `.github/umbrel-release-notes.md` from
# its checkout, and the notes for this version are committed before the tag -
# on main they may already belong to the next release, or (patch release from
# a branch) never have been there.
#
# THE MIGRATION CORPUS (phase 1b, section B). After the Umbrel handover the
# job starts corpus.yml for the tag, from main (tags older than corpus.yml do
# not contain it). corpus.yml decides itself whether the release changes the
# schema and attaches `yuvomi-<version>-corpus.db`; that step may fail without
# failing this run, because the release is out by then.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the assets for, e.g. v2.87.0 (the draft release must exist)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack the release tarball (read-only)
    runs-on: ubuntu-latest
    # Read-only: this job runs npm install scripts and the Vite build.
    permissions:
      contents: read
    # Measured steps are seconds (npm ci about a minute, three builds of about
    # one second each, archive, hash); nothing waits on purpose. 20 leaves room
    # for a slow npm registry without hiding a hang for six hours.
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.version.outputs.tarball }}

    steps:
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run this workflow at the tag, so the attestation names it: gh workflow run release-assets.yml --ref $TAG -f tag=$TAG (this run is on $GITHUB_REF)"
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "version=$VERSION"
            echo "tarball=yuvomi-$VERSION-dist.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # The build needs the devDependencies (Vite); Puppeteer's browser is for
      # the test suites only and stays undownloaded.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      # The revision is the tagged commit - the same value docker-publish.yml
      # bakes into the image, so both artifacts name the same service worker cache.
      - name: Build the web app and check that the build is deterministic
        env:
          APP_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          node scripts/check-build-determinism.mjs --ref "refs/tags/$TAG"
          test -f dist/index.html && test -f dist/sw.js && test -f dist/THIRD-PARTY-NOTICES.txt

      - name: Pack the tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "refs/tags/$TAG")"
          rm -rf stage && mkdir stage
          git archive --format=tar --prefix="yuvomi-$VERSION/" "refs/tags/$TAG" | tar -x -C stage
          cp -R dist "stage/yuvomi-$VERSION/dist"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
            -C stage -cf - "yuvomi-$VERSION" | gzip -n > "$TARBALL"
          gzip -t "$TARBALL"
          # The server refuses to start without the build: it must be in the asset.
          # The listing goes in once; `grep -q` on a pipe would SIGPIPE tar.
          LISTING="$(tar -tzf "$TARBALL")"
          for NEED in index.html sw.js THIRD-PARTY-NOTICES.txt; do
            if ! grep -qxF "yuvomi-$VERSION/dist/$NEED" <<< "$LISTING"; then
              echo "::error::$TARBALL has no yuvomi-$VERSION/dist/$NEED"
              exit 1
            fi
          done
          # Every entry sits under the one top-level folder (YunoHost
          # `in_subdir`, Proxmox `_deploy_source_tarball`). sed reads the whole
          # listing, so pipefail never sees a SIGPIPE from tar.
          OUTSIDE="$(tar -tzf "$TARBALL" | sed -n "\#^yuvomi-$VERSION/#!p" | sed -n 1p)"
          if [ -n "$OUTSIDE" ]; then
            echo "::error::$TARBALL has an entry outside yuvomi-$VERSION/: $OUTSIDE"
            exit 1
          fi

      - name: Write SHA256SUMS
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS

      - name: Hand the tarball and SHA256SUMS to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            ${{ steps.version.outputs.tarball }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish the release tarball
    needs: build
    runs-on: ubuntu-latest
    # The only rights in this workflow, for a job that runs no npm and no
    # project code: release upload/edit, the OIDC token for Sigstore, the
    # attestations API, and the Umbrel dispatch (a release published with the
    # workflow token fires no `release: published`).
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    # Seconds of work (download, hash check, one attestation, one upload); 15
    # leaves room for a slow Sigstore or upload round trip.
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run this workflow at the tag (this run is on $GITHUB_REF)"
            exit 1
          fi
          # Fails here, before anything is signed, when there is no release for the tag.
          gh release view "$TAG" --json isDraft --jq '"draft: \(.isDraft)"'

      - name: Take over the tarball and SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      - name: Check the tarball against SHA256SUMS
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          test -f "$TARBALL"
          grep -qF "  $TARBALL" SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ needs.build.outputs.tarball }}
            SHA256SUMS

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          # Replace only on a draft. `--clobber` deletes an existing asset
          # before uploading the new one, so on a PUBLIC release (a rerun after
          # a failure past the publish step) a failed upload would leave the
          # release without its file. There, add only what is missing; the
          # pack is deterministic, so a present file is the same bytes.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$TAG" "$TARBALL" SHA256SUMS --clobber
          else
            HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for NAME in "$TARBALL" SHA256SUMS; do
              if printf '%s\n' "$HAVE" | grep -qxF "$NAME"; then
                echo "$TAG is public and already has $NAME - kept"
              else
                gh release upload "$TAG" "$NAME"
              fi
            done
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          STATE="$(gh release view "$TAG" --json assets,isDraft)"
          echo "$STATE" | jq .
          if [ "$(echo "$STATE" | jq -r .isDraft)" != "false" ]; then
            echo "::error::Release $TAG is still a draft"
            exit 1
          fi
          for NAME in "$TARBALL" SHA256SUMS; do
            if ! echo "$STATE" | jq -e --arg n "$NAME" '.assets | map(.name) | index($n)' > /dev/null; then
              echo "::error::Release $TAG has no asset $NAME"
              exit 1
            fi
          done

      - name: Start the Umbrel catalog publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          NEWEST="$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ "$NEWEST" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest release ($NEWEST); the Umbrel store is not moved back. A deliberate rollback is a manual dispatch of umbrel-publish.yml."
            exit 0
          fi
          gh workflow run umbrel-publish.yml --ref "$TAG" -f version="$VERSION"

      # The migration corpus (phase 1b, section B): corpus.yml decides itself
      # whether this release changes the schema and gets a corpus database. It
      # runs from main, because tags older than corpus.yml do not contain it,
      # and checks out the tag itself. A failure here never fails this run: the
      # release is already out, and the restore drill reports a missing database.
      - name: Start the migration corpus
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run corpus.yml --ref main -f tag="$TAG"
