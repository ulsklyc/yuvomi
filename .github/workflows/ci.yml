name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Von Hand startbar, weil ein Push zweimal ganz durchgefallen ist: am 2.9.2026
  # legte GitHub fuer die neuen Heads von #930 und #993 GAR KEINEN Lauf an -
  # keinen wartenden, keinen fehlgeschlagenen. Ohne diesen Trigger bleibt als
  # Ausweg nur, den PR zu schliessen und wieder zu oeffnen, was den Beitragenden
  # zwei Benachrichtigungen schickt, die nach Ablehnung aussehen.
  # GRENZE: `workflow_dispatch` laeuft gegen einen Ref in DIESEM Repo. Fuer einen
  # Branch aus einem Fork hilft er daher nicht ohne Weiteres - dort bleibt der
  # Reopen. Fuer Branches im Repo selbst (integrate/*, fix/*) ist er der Ausweg.
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf einen PR bricht dessen ueberholten Lauf ab: niemand liest
# das Ergebnis eines Stands, der schon ersetzt ist, und er belegt Runner. Pushes
# auf main und Laeufe von Hand bekommen je Lauf eine eigene Gruppe (run_id) und
# werden nie abgebrochen oder in eine Warteschlange gestellt - jeder main-Stand
# braucht sein eigenes Ergebnis (#1814).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # The chain runs in parallel since #1814. Ten measured jobs on 2026-11-10
    # (PR #2668, four jobs, nproc 4) took 478 to 798 seconds, medians about ten
    # minutes; the serial chain took a median of about 30. 25 leaves room for the
    # slow runner mode (the slowest job above) without letting a hung run sit
    # for 45 minutes. A cancelled run looks red but says nothing about the tests,
    # so the limit moves only on new measurements, not to make a red job green.
    timeout-minutes: 25

    strategy:
      matrix:
        # 24.x ist die Laufzeit des Images (Dockerfile) und die Untergrenze von
        # package.json engines, 26.x die naechste Linie, die engines zulaesst
        # (`^24.12.0 || >=26.0.0`; 25 ist eine ungerade Linie ohne LTS). Bis zum
        # 4.9.2026 lief hier nur 22.x, und kein Test hatte je die Node-Version
        # gesehen, die bei den Nutzern laeuft. test:docker-publish haelt die
        # Zeile und das Image zusammen.
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Zwei Commits tief, damit test:migrations-append-only seine Basis hat:
        # bei pull_request ist HEAD der Merge-Ref und HEAD^1 der main-Stand, bei
        # einem Push auf main der vorige main-Stand. Mit depth 1 fehlt HEAD^1,
        # und der Guard wird rot, statt still zu ueberspringen.
        with:
          fetch-depth: 2
      # Der Checkout bringt keine Tags mit, test:changelog vergleicht aber die
      # veroeffentlichten CHANGELOG-Abschnitte mit dem Tag des neuesten Abschnitts
      # (warum einer reicht, steht am Guard). Die Version kommt nie aus der Datei, die
      # geprueft wird: benennt ein PR die neueste Ueberschrift um, holte der Step sonst
      # einen aelteren Tag, und die Umbenennung fiele durch. So steht der Tag der Basis
      # ohne Ueberschrift da, und der Paritaets-Test wird rot. Die Quelle haengt am
      # Anlass (alles aus dem Review von PR #1183):
      # - pull_request: HEAD^1, die Basis, auf der der Merge-Commit steht. Nicht das
      #   laufende main: wird waehrend des Laufs ein Release getaggt, holte der Step
      #   dessen Tag, und der Paritaets-Test waere fuer einen unveraenderten PR rot.
      # - push: der main-Stand VOR dem Push (github.event.before), nicht HEAD (#1185). Mit
      #   HEAD waehlte ein direkter Push, der die neueste Ueberschrift loescht oder
      #   umbenennt, seine Referenz selbst und blieb gruen. HEAD^1 allein reicht nur fuer
      #   einen Push aus EINEM Commit; bei mehreren steht die Umbenennung schon im
      #   Elternteil. Liegt der Vorstand nicht im flachen Klon, wird er einzeln geholt,
      #   --depth=1 ist dort unschaedlich: er ist nie HEAD, und HEAD^1 faengt cat-file
      #   vorher ab. Rueckfall HEAD^1 fuer die Null-SHA eines neuen Zweigs und fuer einen
      #   Vorstand, den der Server nicht mehr herausgibt (Force-Push).
      # - workflow_dispatch: main, eigens geholt. HEAD^1 ist dort der Elternteil im
      #   Zweig, nach einem Merge von main in einen alten Zweig also der alte Stand. Ein
      #   Zweig hinter einem Release wird damit rot wie jeder lokale Lauf mit allen Tags.
      # Der zweitneueste Abschnitt ist der Rueckfall fuer einen Vorstand, dessen neuester
      # Abschnitt noch keinen Tag hat. depth 2 und nicht 1, fuer main wie fuer den Tag:
      # zeigt der Ref auf HEAD selbst, macht --depth=1 HEAD flach, HEAD^1 verschwindet
      # und test:migrations-append-only wird rot (in einem Klon nachgestellt).
      - name: Fetch the release tag of the newest CHANGELOG section
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) source=HEAD^1 ;;
            push)
              source=HEAD^1
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
                echo "No pre-push revision - reading the CHANGELOG reference from HEAD^1."
              elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
                || git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
                source=$PUSH_BEFORE
              else
                echo "Pre-push revision $PUSH_BEFORE is not available - reading the CHANGELOG reference from HEAD^1."
              fi
              ;;
            *)
              git fetch --no-tags --depth=2 origin +refs/heads/main:refs/remotes/origin/main
              source=refs/remotes/origin/main
              ;;
          esac
          for version in $(git show "${source}:CHANGELOG.md" | grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -n 2 | tr -d '#[] '); do
            if git fetch --no-tags --depth=2 origin "+refs/tags/v${version}:refs/tags/v${version}"; then
              exit 0
            fi
          done
          echo "No release tag found - the released-section guard in test:changelog will skip."
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Der Server verlangt dist/ (Phase 1a, Abschnitt D), und die Suiten zum
      # Artefakt lesen es. `npm test` baut ueber `pretest` noch einmal (eine
      # Sekunde); der eigene Schritt hier zeigt die Bauzeit getrennt.
      - name: Build the web app
        run: npm run build

      # Zwei Builds desselben Commits in zwei Verzeichnissen, sha256 jeder Datei
      # unter dist/ (Fertig-Kriterium F5). Rot heisst: der Release-Tarball liesse
      # sich aus dem Quelltarball nicht nachbauen.
      - name: Check that the build is deterministic
        run: node scripts/check-build-determinism.mjs

      # Die Kette laeuft ueber den Parallel-Runner (#1814): jeder Schritt von
      # `npm test` als eigener Prozess, vier gleichzeitig, und ein roter Schritt
      # haelt den Lauf nicht an. Am Ende stehen alle roten Schritte mit ihrem Log,
      # der Exit-Code ist der der ganzen Kette. Die Jobzahl steht fest statt
      # "Kerne minus eins", damit eine Messung von gestern auch morgen dieselbe
      # Laufart misst; der naechste Schritt zeigt, wie viele Kerne der Runner hat.
      - name: Show the runner's core count
        run: nproc

      - name: Run tests
        run: npm run test-parallel -- --jobs 4 --logs "$RUNNER_TEMP/test-logs"

      # Die Logs der Schritte liegen nur auf dem Runner; bei Rot gehen sie als
      # Artefakt mit, sonst bliebe vom roten Schritt nur sein Pfad im Job-Log.
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 7

  # DIE EINZIGE BROWSER-SUITE IN DER CI (Entscheidung vom 23.9.2026). Die uebrigen
  # Browser-Suiten haengen an `test:document-guards` und laufen nur von Hand (rund
  # 80 Minuten, docs/test-suites.md). test:fasting-browser lief genauso und war seit
  # 05e6ef250 in 4 von 15 Journal-Tests rot, ohne dass es jemand sah. Sie braucht
  # allein rund 7 Minuten und laeuft deshalb hier als eigener Job, parallel zu den
  # Tests. Eine Node-Version reicht: die Suite misst das Dokument im Browser, nicht
  # die Laufzeit; 24.x ist die des Images. Chromium bringt `npm ci` mit (puppeteer,
  # freigegeben unter `allowScripts` in package.json), der Harness startet es
  # headless mit --no-sandbox (test/document-guards-harness.js).
  fasting-browser:
    name: Fasting browser suite (Node.js 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Der Harness startet den Server, und der liefert nur das gebaute dist/ -
      # hier in der Testanordnung (jedes Modul unter seinem Quellpfad, siehe
      # vite.config.ts), weil die Suiten Module der laufenden App importieren.
      - name: Build the web app (browser test layout)
        run: npm run build:browser-tests

      - name: Run the fasting browser suite
        run: npm run test:fasting-browser

  # Restore-Drill (Phase 1b, Abschnitt B): jede Korpus-DB der Releases ueber den
  # echten Restore-Weg einspielen und auf den Kopf DIESES Stands migrieren - eine
  # Migration, die eine alte Datenbank bricht, faellt im PR auf statt beim Nutzer.
  # Derselbe Job laeuft nachts aus restore-drill.yml. Kein Pflicht-Check.
  # `timeout-minutes` darf hier nicht stehen (GitHub lehnt es an einem Job ab,
  # der einen wiederverwendbaren Workflow ruft); der gerufene Job traegt 20.
  restore-drill:
    name: Restore drill
    permissions:
      contents: read
    uses: ./.github/workflows/restore-drill.yml

  # Typpruefung (Phase 1a, Abschnitt C): `tsc --build` ueber server/, public/ und
  # test/ mit checkJs und strict, verglichen mit tsc-baseline.json, die nur sinken
  # darf. Eigener Job, parallel zu den Tests; eine Node-Version reicht, 24.x ist
  # die des Images und traegt das Type Stripping fuer scripts/check-tsc-baseline.ts.
  typecheck:
    name: Typecheck (Node.js 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check against the baseline
        run: npm run typecheck

  # Lint (phase 1b, section D): oxlint with the rule set in .oxlintrc.json, compared
  # with lint-baseline.json, which only sinks (scripts/check-lint-baseline.ts). Hard
  # rules (innerHTML/outerHTML writes, async or await in a db.transaction() body)
  # have no baseline at all. Own job, parallel to the tests; one Node version is
  # enough, the rules read source text, not the runtime.
  lint:
    name: Lint (Node.js 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint against the baseline
        run: npm run lint
