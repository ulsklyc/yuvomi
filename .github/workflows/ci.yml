name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Von Hand startbar, weil ein Push zweimal ganz durchgefallen ist: am 2.9.2026
  # legte GitHub fuer die neuen Heads von #930 und #993 GAR KEINEN Lauf an -
  # keinen wartenden, keinen fehlgeschlagenen. Ohne diesen Trigger bleibt als
  # Ausweg nur, den PR zu schliessen und wieder zu oeffnen, was den Beitragenden
  # zwei Benachrichtigungen schickt, die nach Ablehnung aussehen.
  # GRENZE: `workflow_dispatch` laeuft gegen einen Ref in DIESEM Repo. Fuer einen
  # Branch aus einem Fork hilft er daher nicht ohne Weiteres - dort bleibt der
  # Reopen. Fuer Branches im Repo selbst (integrate/*, fix/*) ist er der Ausweg.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        # 22.x ist die Entwicklungs-Baseline (package.json engines), 24.x ist die
        # Laufzeit des Images (Dockerfile). Bis zum 4.9.2026 lief hier nur 22.x,
        # und kein Test hatte je die Node-Version gesehen, die bei den Nutzern
        # laeuft. test:docker-publish haelt beide Zeilen zusammen.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Zwei Commits tief, damit test:migrations-append-only seine Basis hat:
        # bei pull_request ist HEAD der Merge-Ref und HEAD^1 der main-Stand, bei
        # einem Push auf main der vorige main-Stand. Mit depth 1 fehlt HEAD^1,
        # und der Guard wird rot, statt still zu ueberspringen.
        with:
          fetch-depth: 2
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
