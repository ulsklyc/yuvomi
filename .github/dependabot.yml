version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    # Node-Majors bleiben Handarbeit. Dependabot schlägt jeden neuen Major vor,
    # auch solange er "Current" und nicht LTS ist (Node 26 ab April 2026, LTS
    # erst ab Oktober). Ein selbst gehostetes Image läuft bei den Nutzern
    # monatelang unangetastet, und die CI testet nur die Majors in ihrer
    # Matrix (22.x und 24.x seit dem 4.9.2026; test:docker-publish haelt
    # Matrix und Dockerfile zusammen) - der Bump käme also ungeprüft. Minor- und Patch-Updates der laufenden
    # LTS-Linie zieht Dependabot weiterhin selbst.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
