<!DOCTYPE html>

  <meta charset="UTF-8" />
  <!-- Viewport: edge-to-edge, kein Zoom (PWA-native feel) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />

  <!-- PWA / Theme.
       Die Werte SIND --color-bg aus tokens.css (hell --neutral-100 #F5F3ED,
       dunkel #191816). Ein Meta-Attribut nimmt an keiner Kaskade teil, also
       muessen sie hier als Literal stehen - dass sie es bleiben, haelt der
       Guard "the status bar colour is the page background" im frontend-audit.
       Vorher stand hier dunkel #0C0C0E, zwei Stufen neben der Seite, die die
       Statusleiste rahmt. -->
  <meta name="theme-color" content="#F5F3ED" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)" />
  <!-- Hell UND dunkel, schon vor dem ersten Stylesheet: sonst malt der Browser
       Leinwand, Scrollleisten und Formularelemente bis zum CSS hell, im Dark
       ein weisser Blitz. Eine ausdrueckliche Wahl legt theme-init.js fest. -->
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS-spezifisch -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

  <!-- Theme: explizite Nutzer-Overrides vor CSS-Rendering anwenden (Flash-Prevention).
       System-Präferenz wird durch @media (prefers-color-scheme: dark) in tokens.css
       direkt per CSS behandelt — kein JS-matchMedia erforderlich. -->
  <!-- Die Nachtstunden dieses Geraets (#2234): theme-init.js fragt sie fuer
       das erste Bild, die Module dieselbe Datei (utils/night-hours.js). -->
  <script src="/night-hours.js"></script>

  <script src="/lang-init.js"></script>

       parallel zu den Modulen - api.js holt die Antworten ab (R20). -->

  <!-- Platzhalter: Hier haengen die Blaetter geteilter Komponenten, die der Start
       nicht braucht (Datumsfeld, Kategorien, Symbolauswahl, Dokumentanhang,

       danach (utils/component-style.js); die Stelle haelt die Kaskade wie vorher.

  <!-- Lucide Icons (lokal, v0.469.0) -->
  <!-- `fetchpriority="high"` (R19): ein defer-Skript laedt sonst mit niedriger
       Prioritaet HINTER allen modulepreloads unten - und weil die Modulskripte
       im <body> erst nach den defer-Skripten im <head> laufen, wartete der
       Router auf die Icons (gemessen: lucide.min.js fertig 4,3 s statt 1,4 s). -->
  <script src="/lucide.min.js" defer fetchpriority="high"></script>
  <!-- Direkt nach dem Bundle: gibt createIcons({ el }) echtes Scoping,
       siehe Dateikopf von lucide-scope.js. -->
  <script src="/lucide-scope.js" defer fetchpriority="high"></script>

  <!-- Die Rueckfallsprache braucht jeder Start vor dem ersten Bild (i18n.js laedt
       sie immer); die eigene Sprache meldet lang-init.js auf dieselbe Weise an. -->
  <link rel="preload" href="/locales/de.json" as="fetch" crossorigin />

  <!-- Die Startkette als modulepreload (Critique R19): der statische Modulgraph
       von api.js, router.js und den Modulskripten unten, danach der der
       Uebersicht (/pages/dashboard.js, die Startseite). Ohne diese Liste entdeckt
       der Browser die Module Ebene fuer Ebene - am Telefon (4x CPU, Fast 4G) sieben
       Rundreisen hintereinander, bevor die Uebersicht ihre Daten anfragen kann.
       Die Liste ist GEMESSEN, nicht geschaetzt: `npm run test:startup-preload`
       rechnet den Graphen nach und nennt jedes fehlende oder ueberzaehlige Modul.
       Sie steht bewusst am Ende von <head>: die Blaetter und die beiden kleinen
       Startskripte oben gehen zuerst auf die Leitung. Der Teil der Uebersicht
       traegt `fetchpriority="low"`: sonst warteten die ersten API-Abrufe des
       Routers (Sitzung, Einstellungen) hinter ihm in der Schlange der sechs
       HTTP/1.1-Verbindungen - gemessen eine volle Sekunde. -->

  <!-- Offline-Banner: sichtbar wenn navigator.onLine === false -->
  <div id="offline-banner" class="offline-banner" hidden aria-live="polite" role="status">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <span data-i18n="offline.banner"></span>
  </div>

  <!-- App-Shell - wird durch JavaScript gefüllt -->
  <div id="app" class="app-shell">
    <!-- Ladebild (R20): eine stehende Skizze der Shell statt eines pulsierenden
         Schriftzugs - Kopf mit Siegel, drei Kartenflaechen, unten die Kapsel
         (am Desktop die Seitenleiste). Nichts bewegt sich; die App setzt sich
         an derselben Stelle zusammen. `progressbar` ohne Wert ist "laedt", und
         die Rolle sagt der Screenreader in seiner Sprache an - der Name ist
         die Marke, fest in jeder Sprache (vorher: "Lade Yuvomi…", immer deutsch). -->
    <div id="app-loading" class="app-loading" role="progressbar" aria-label="Yuvomi">
      <div class="app-loading__rail" aria-hidden="true"></div>
      <div class="app-loading__page" aria-hidden="true">
        <div class="app-loading__head">
          <span class="app-loading__seal"><svg class="brand-mark" viewBox="0 0 160 160" fill="none" focusable="false"><defs><linearGradient id="yuvomi-brand-mark-boot" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse"><stop class="brand-mark__from" offset="0%"/><stop class="brand-mark__to" offset="100%"/></linearGradient></defs><rect width="160" height="160" rx="36" fill="url(#yuvomi-brand-mark-boot)"/><g class="brand-mark__circles"><circle cx="64" cy="72" r="27"/><circle cx="100" cy="78" r="25"/><circle cx="80" cy="106" r="24"/></g></svg></span>
          <span class="app-loading__logo">Yuvomi</span>
        </div>
        <!-- Die Uebersicht als Skizze (R21 S9b): Gruss, Wetterzeile, "Heute
             wichtig" und das Tagesprogramm als EINE hohe Karte, am Desktop
             darunter die Kachelreihe - dort, wo sie gleich stehen. -->
        <span class="app-loading__bar app-loading__bar--title"></span>
        <span class="app-loading__bar app-loading__bar--weather"></span>
        <span class="app-loading__bar app-loading__bar--section"></span>
        <div class="app-loading__card app-loading__card--program"></div>
        <div class="app-loading__row">
          <div class="app-loading__card"></div>
          <div class="app-loading__card"></div>
          <div class="app-loading__card"></div>
        </div>
      </div>
      <div class="app-loading__capsule" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Module (ES-Module, kein Bundler) -->
  <script type="module" src="/api.js"></script>
  <script type="module" src="/router.js"></script>
  <script type="module" src="/components/photo-screensaver.js"></script>

  <!-- Install-Prompt (PWA) -->
  <yuvomi-install-prompt></yuvomi-install-prompt>
  <script type="module" src="/components/yuvomi-install-prompt.js"></script>

  <!-- Service Worker registrieren (ES-Modul: exportiert clearApiCache) -->
  <script type="module" src="/sw-register.js"></script>
